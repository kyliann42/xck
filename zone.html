<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zone d'activité — NovaClean+</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="site zone-site">
        <header style="margin-bottom:18px;display:flex;align-items:center;gap:12px">
            <div class="logo-badge">NC+</div>
            <div>
                <h1>Zone d'activité</h1>
                <p class="lead">Nous intervenons dans les secteurs suivants :</p>
            </div>
            <button class="theme-toggle" type="button" title="Changer de thème" aria-label="Activer le thème clair"
                aria-pressed="false"></button>
        </header>

        <main>
            <section class="card">
                <h2>Carte et liste des villes</h2>
                <p class="lead">Zone principale: rayon de 40 km autour de notre base.</p>

                <div class="zone-content">
                    <ul class="zone-list">
                        <li>Si vous souhaitez un service dans une ville non listée, contactez-nous pour discuter de votre demande.</li>
                    </ul>
                    <div class="map-container">
                        <!-- Exemple d'iframe Google Maps (ajustez l'embed si vous avez une adresse) -->
                        <iframe src="https://maps.google.com/maps?q=Montauban,France&z=12&output=embed" width="100%"
                            height="300" style="border:0;border-radius:8px" allowfullscreen="" loading="lazy"></iframe>
                    </div>
                </div>
            </section>
        </main>

        <footer class="zone-footer">
            <a href="index.html" style="color:var(--muted);text-decoration:none">Retour</a>
        </footer>
    </div>
    <script src="js/theme.js" defer></script>
</body>

</html>
